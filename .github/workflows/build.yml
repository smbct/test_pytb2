name: build

on:
  workflow_dispatch: # debug

jobs:

    build:
        runs-on: ubuntu-latest
        name: build
        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-python@v6
              with:
                python-version: "3.13"
                cache: "pip"
            - name: install pytb2
              run: pip install pytoulbar2
            - name: test pytb2
              run: python -c "import pytoulbar2"
